<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyNova - Web Proxy</title>
    <!-- 
      Ultraviolet Core Frontend scripts. 
      These paths point to the standard static bundle locations generated by your Ultraviolet-Node installation.
    -->
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 4rem 2rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.25rem;
            margin: 0 0 3rem 0;
            max-width: 600px;
        }

        .proxy-form {
            width: 100%;
            max-width: 650px;
            margin-bottom: 1.5rem;
        }

        .search-container {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .search-container:focus-within {
            border-color: var(--accent-color);
        }

        .search-container input {
            flex: 1;
            background: none;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            color: var(--text-main);
            outline: none;
        }

        .search-container input::placeholder {
            color: var(--text-muted);
        }

        .search-container button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-container button:hover {
            background-color: var(--accent-hover);
        }

        #status-message {
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            min-height: 1.5rem;
        }

        .status-loading { color: var(--accent-color); }
        .status-error { color: var(--error-color); }

        .quick-links {
            width: 100%;
        }

        .quick-links h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .shortcut {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .shortcut:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .shortcut-icon {
            font-size: 1.5rem;
        }

        footer {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 640px) {
            .hero h1 { font-size: 2.25rem; }
            .search-container { flex-direction: column; border-radius: 16px; padding: 0.5rem; gap: 0.5rem; }
            .search-container button { border-radius: 10px; padding: 0.75rem; }
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Proxy<span>Nova</span></a>
        <nav class="nav-links">
            <a href="https://github.com" target="_blank">GitHub</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Browse the Web Freely</h1>
            <p>A sophisticated proxy layer designed to bypass local filtering blocks securely using Service Workers.</p>
        </div>

        <form class="proxy-form" id="proxyForm">
            <div class="search-container">
                <input type="text" id="urlInput" placeholder="Enter website URL or search query..." autocomplete="off" required>
                <button type="submit">Launch</button>
            </div>
        </form>

        <div id="status-message"></div>

        <div class="quick-links">
            <h2>Fast Actions</h2>
            <div class="grid">
                <a href="#" class="shortcut" data-url="https://youtube.com">
                    <span class="shortcut-icon">📺</span>
                    <span>YouTube</span>
                </a>
                <a href="#" class="shortcut" data-url="https://discord.com">
                    <span class="shortcut-icon">💬</span>
                    <span>Discord</span>
                </a>
                <a href="#" class="shortcut" data-url="https://google.com">
                    <span class="shortcut-icon">🔍</span>
                    <span>Google</span>
                </a>
                <a href="#" class="shortcut" data-url="https://reddit.com">
                    <span class="shortcut-icon">🤖</span>
                    <span>Reddit</span>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ProxyNova. Powered by Ultraviolet Rewriting Infrastructure.</p>
    </footer>

    <script>
        const form = document.getElementById('proxyForm');
        const input = document.getElementById('urlInput');
        const statusEl = document.getElementById('status-message');

        // Main event pipeline for form submissions
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await launchProxy(input.value);
        });

        // Quick shortcut click mappings
        document.querySelectorAll('.shortcut').forEach(item => {
            item.addEventListener('click', async (e) => {
                e.preventDefault();
                await launchProxy(item.getAttribute('data-url'));
            });
        });

        /**
         * Resolves, encodes, registers, and redirects to the proxy context.
         */
        async function launchProxy(query) {
            // 1. Ensure Ultraviolet environment properties are ready
            if (!window.__uv$config) {
                updateStatus("Error: Ultraviolet config script not loaded. Check paths.", "error");
                return;
            }

            updateStatus("Registering proxy worker environment...", "loading");

            try {
                // 2. Register Ultraviolet's underlying Service Worker scope natively
                // Uses values set programmatically by your uv.config.js asset
                await navigator.serviceWorker.register(window.__uv$config.sw, {
                    scope: window.__uv$config.prefix
                });

                // 3. Clean and parse input criteria into a structured URL string
                let targetUrl = query.trim();
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
                        targetUrl = 'https://' + targetUrl;
                    } else {
                        // Fallback engine lookup logic mapping 
                        targetUrl = 'https://google.com/search?q=' + encodeURIComponent(targetUrl);
                    }
                }

                // 4. Transform string using Ultraviolet's Client Codec configuration (XOR / Base64)
                const encodedPath = window.__uv$config.encodeUrl(targetUrl);
// 5. Hard route swap directly into the active proxy worker scope
window.location.href = window.__uv$config.prefix + encodedPath;
} catch (err) {
updateStatus(Worker registration failed: ${err.message}, "error");
}
}
function updateStatus(msg, type) {
statusEl.textContent = msg;
statusEl.className = type === "error" ? "status-error" : type === "loading" ? "status-loading" : "";
}
